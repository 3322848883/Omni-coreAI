groups:
  - name: disc-trio
    topology: single_account
    members: [pa-a, smc-paper, orderflow-paper]
    target_account: pa-a
    fusion: weighted_vote
    fusion_config:
      weights: {pa-a: 1, smc-paper: 1, orderflow-paper: 1}
    on_conflict: hold
    enabled: true
    discussion:
      enabled: true
      rounds: 3
      timeout_sec: 120
      early_exit_on_agreement: false
  - name: e2e-quad
    topology: single_account
    members: [pa-a, pa-b, pa-c, pa-d]
    target_account: pa-a
    fusion: weighted_vote
    fusion_config:
      weights: {pa-a: 2, pa-b: 1, pa-c: 1, pa-d: 1}
    on_conflict: hold
    enabled: true
  - name: single-test
    topology: single_account
    members: [pa-a, pa-b]
    target_account: pa-a
    fusion: master_arbiter
    fusion_config: {master: pa-a}
    on_conflict: hold
    enabled: true
  - name: disc-test
    topology: single_account
    members: [pa-a, pa-b, pa-c]
    target_account: pa-a
    fusion: weighted_vote
    fusion_config:
      weights: {pa-a: 1, pa-b: 1, pa-c: 1}
    on_conflict: hold
    enabled: true
    discussion:
      enabled: true
      rounds: 3
      timeout_sec: 120
      early_exit_on_agreement: false
  - name: consensus-test
    topology: single_account
    members: [pa-a, pa-b, pa-c]
    target_account: pa-a
    fusion: consensus
    fusion_config:
      threshold: 0.6
      weights: {pa-a: 1, pa-b: 1, pa-c: 1}
    on_conflict: hold
    enabled: true
  - name: mirror-test
    topology: mirror_accounts
    members: [pa-a, pa-b]
    fusion: weighted_vote
    fusion_config:
      weights: {pa-a: 1, pa-b: 1}
    on_conflict: hold
    enabled: true
  # ── 人格集对照实验（2026-10-03）──────────────────────────────
  # 两组机器人配置**完全相同**（同所同周期同工具同模型同风控），
  # 唯一变量是 prompt_file 组成的人格集。用来回答「哪三个人格讨论质量更高」。
  - name: disc-ctl
    # 对照组：复刻原 disc-test 的人格集
    topology: single_account
    members: [pt-a1, pt-a2, pt-a3]
    target_account: pt-a1
    fusion: weighted_vote
    fusion_config:
      weights: {pt-a1: 1, pt-a2: 1, pt-a3: 1}
    on_conflict: hold
    enabled: true
    discussion:
      enabled: true
      rounds: 3
      timeout_sec: 120
      early_exit_on_agreement: false
  - name: disc-exp
    # 实验组：Brooks(价格结构) + ICT(时间×流动性) + 订单流(微观成交)
    topology: single_account
    members: [pt-b1, pt-b2, pt-b3]
    target_account: pt-b1
    fusion: weighted_vote
    fusion_config:
      weights: {pt-b1: 1, pt-b2: 1, pt-b3: 1}
    on_conflict: hold
    enabled: true
    discussion:
      enabled: true
      rounds: 3
      timeout_sec: 120
      early_exit_on_agreement: false
