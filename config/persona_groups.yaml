groups:
  - name: disc-trio
    topology: single_account
    members: [pa-a, smc-paper, orderflow-paper]
    target_account: pa-a
    fusion: weighted_vote
    fusion_config:
      weights: {pa-a: 1, smc-paper: 1, orderflow-paper: 1}
    on_conflict: hold
    enabled: true
    discussion:
      enabled: true
      rounds: 3
      timeout_sec: 120
      early_exit_on_agreement: false
  - name: e2e-quad
    topology: single_account
    members: [pa-a, pa-b, pa-c, pa-d]
    target_account: pa-a
    fusion: weighted_vote
    fusion_config:
      weights: {pa-a: 2, pa-b: 1, pa-c: 1, pa-d: 1}
    on_conflict: hold
    enabled: true
  - name: single-test
    topology: single_account
    members: [pa-a, pa-b]
    target_account: pa-a
    fusion: master_arbiter
    fusion_config: {master: pa-a}
    on_conflict: hold
    enabled: true
  - name: disc-test
    topology: single_account
    members: [pa-a, pa-b, pa-c]
    target_account: pa-a
    fusion: weighted_vote
    fusion_config:
      weights: {pa-a: 1, pa-b: 1, pa-c: 1}
    on_conflict: hold
    enabled: true
    discussion:
      enabled: true
      rounds: 3
      timeout_sec: 120
      early_exit_on_agreement: false
  - name: consensus-test
    topology: single_account
    members: [pa-a, pa-b, pa-c]
    target_account: pa-a
    fusion: consensus
    fusion_config:
      threshold: 0.6
      weights: {pa-a: 1, pa-b: 1, pa-c: 1}
    on_conflict: hold
    enabled: true
  - name: mirror-test
    topology: mirror_accounts
    members: [pa-a, pa-b]
    fusion: weighted_vote
    fusion_config:
      weights: {pa-a: 1, pa-b: 1}
    on_conflict: hold
    enabled: true
  # ── 人格集对照实验（2026-10-03）──────────────────────────────
  # 两组机器人配置**完全相同**（同所同周期同工具同模型同风控），
  # 唯一变量是 prompt_file 组成的人格集。用来回答「哪三个人格讨论质量更高」。
  - name: disc-ctl
    # 对照组：复刻原 disc-test 的人格集
    topology: single_account
    members: [pt-a1, pt-a2, pt-a3]
    target_account: pt-a1
    fusion: weighted_vote
    fusion_config:
      weights: {pt-a1: 1, pt-a2: 1, pt-a3: 1}
    on_conflict: hold
    enabled: true
    discussion:
      enabled: true
      rounds: 3
      timeout_sec: 120
      early_exit_on_agreement: false
  - name: disc-exp
    # 实验组：Brooks(价格结构) + ICT(时间×流动性) + 订单流(微观成交)
    topology: single_account
    members: [pt-b1, pt-b2, pt-b3]
    target_account: pt-b1
    fusion: weighted_vote
    fusion_config:
      weights: {pt-b1: 1, pt-b2: 1, pt-b3: 1}
    on_conflict: hold
    enabled: true
    discussion:
      enabled: true
      rounds: 3
      timeout_sec: 120
      early_exit_on_agreement: false

  # ── ETH 三人格讨论组（2026-10-04）────────────────────────────
  # 三种**方法论互不重叠**的人格，同看 ETH 单币：
  #   订单流   微观成交（订单簿 / 逐价位 Delta / 主动买卖）
  #   SMC      结构事件（BOS/CHoCH / 扫荡 / OB-FVG）
  #   Wyckoff  量价阶段（A–E 状态机 / 吸筹派发）
  # 实测（三人格真实行情对照）同一时点常给出不同甚至相反的结论 ——
  # 这组就是让它们当面辩：2 轮（相互反驳 → 最终决策）后等权融合。
  #
  # 成员必须是**单币**配置（smc-eth-live / orderflow-eth-live / wyckoff-eth-live）：
  # 快照按 symbols 注入行情，双币配置会让三个人格各说一个币，融合时串标的。
  # 三个成员都是 env: live（真实账户上下文），但 enabled: false ——
  # persona-run 不读 enabled，所以分析照常、不会下单。
  - name: eth-disc
    topology: single_account
    members: [smc-eth-live, orderflow-eth-live, wyckoff-eth-live]
    target_account: smc-eth-live
    fusion: weighted_vote
    fusion_config:
      weights: {smc-eth-live: 1, orderflow-eth-live: 1, wyckoff-eth-live: 1}
    on_conflict: hold
    enabled: true
    # 交给 watchdog 守护：`persona-run` 是这组的大脑，它挂了意味着
    # 「保护单有人管、但没人再决策」。**必须显式开**（默认关）——
    # 只看 enabled 的话，本机 9 个组（含 4 个对照实验组）会全被拉起来烧钱。
    runtime: {persona_run: true}
    discussion:
      enabled: true
      # 2 轮（2026-10-05 从 3 轮下调）：一次完整讨论的模型调用数 =
      # 成员数 ×(1 次独立分析 + N 轮辩论)，3 人 3 轮 = 12 次、2 轮 = 9 次，
      # 省掉 1/4 的调用开销。更重要的理由不是省钱：**轮数不是提高质量的旋钮**，
      # 辩论收益很快平台化，而从众（sycophancy）会随轮数累积；提高质量要靠
      # 增加**异质**成员（见 research/trading-system-design-upgrade/REPORT.md）。
      rounds: 2
      timeout_sec: 120
      # 不早退：即使首轮就一致也要跑满 2 轮，保留完整的辩论过程供审计
      early_exit_on_agreement: false
