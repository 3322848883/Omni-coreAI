# 既有策略1 · Brooks 实盘版 — 本地模拟盘
# prompt: prompts/brooks_btc_pa.md（2% 风险 / 50x / BTC only / 结构破坏即走）
bot_id: brooks-pa-paper
enabled: true
env: paper
symbols:
  - BTC_USDT
# 2% 紧止损时名义可达 10 万+，护栏给足
max_notional_usd: 150000
max_orders_per_file: 10
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: brp
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 150000
  daily_loss_limit_usd: 400

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 50
  fee_rate: 0.0005
  maker_fee_rate: 0.0
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  enabled: true
  prompt_file: prompts/brooks_btc_pa.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 120
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 4
  market:
    mode: rest_only
    indicators: [ema20, atr14]
    extra_candles: 15
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.55
    max_chips: 2
    max_notional_usd: 150000
  llm:
    provider: gw-flash
    reasoning_effort: high
