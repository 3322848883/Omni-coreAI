# 10 层阶梯网格（7 网 + 3 马）· 本地模拟盘 · 人格 v5 价格行为版
#
# 目的：10 小时真实 AI + 真实行情模拟盘测试 prompts/ladder_v5_pa.md
#   （动态多空 + 迟滞带 + PA 回调选点 + 底仓章节）
#
# 来源：config/bots/martin-grid-paper.yaml（paper 模板）→ 改 5 处：
#   ① bot_id / account / label_prefix 独立（不与 mgp 共账户）
#   ② prompt_file → prompts/ladder_v5_pa.md
#   ③ max_leverage 50、total_risk_pct 0.35 —— 对齐实盘 martin-grid.yaml
#     （paper 模板里的 0.80 是 20 层实验变量，不是实盘行为）
#   ④ paper 段独立 store：data/accounts/gate-v5-paper/account.db
#   ⑤ initial_capital 67 —— 对齐实盘权益量级（~67.8U），风控闸门才测得出来
#
# 用途：`python -m omnialpha once --bot ladder-v5-paper`（单轮验证）
#       `python -m omnialpha run  --bot ladder-v5-paper`（10h 持续跑）

bot_id: ladder-v5-paper
account: gate-v5-paper
enabled: false
env: paper

symbols:
  - ETH_USDT

max_notional_usd: 1200
max_orders_per_file: 32
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: v5p
position_policy: free
default_replace: none
place_before_cancel: true
order_scope: own
require_sl: true

account_risk:
  # ---- 与实盘 martin-grid.yaml 逐项一致（2026-10-22 对齐）----
  grid_tp_auto: live
  halt: false
  max_leverage: 50
  margin_mode: cross
  max_total_notional_usd: 1400
  risk_pct: 0.12
  total_risk_pct: 0.35
  max_notional_pct: 5.0
  max_total_notional_pct: 19.0
  daily_loss_limit_usd: 15
  no_flip: false
  stray_position: warn
  peak_trail: false
  peak_trail_atr: 2.0
  sl_move_policy: ladder

strategist:
  prompt_file: prompts/ladder_v5_pa.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: false
  event_timeframe: 15m
  candles: 200
  write_hold: true
  vision: false
  tools:
    enabled: true
    native: true
    max_rounds: 14
    # 取数覆盖（2026-10-27 补）：人格的判据是「4H 定方向、15m 定档位」，
    # 不强制覆盖时实测每轮只调 2~4 次（smc_map 只查 1 个周期）就下结论 ——
    # 等于拿一个周期的结构去判大方向。与 martin-grid 对齐。
    required_coverage:
      smc_map: ["15m", "1h", "4h", "1d"]
      smc_events: ["15m", "1h"]
    allow:
      - klines
      - ticker
      - contract
      - smc_map
      - smc_events
      - indicators
      # TV Pine 指标（价格行为相关）：通道/趋势线、RSI 结构标签、Wyckoff 阶段
      - tv_linreg_trendlines
      - tv_rsi_yata
      - tv_wyckoff
  market:
    mode: rest_only
    indicators: [atr14, ema20, ema200]
    timeframes: ["5m", "15m", "1h", "4h", "1d"]
    extra_candles: 60
  ai_triggers:
    enabled: false
    max_active: 5
    default_cooldown_sec: 900
  risk:
    min_confidence: 0.55
    max_chips: 32
    max_notional_usd: 1200
  skills: []
  llm:
    provider: gw-flash
    reasoning_effort: high
    max_tokens: 32768

paper:
  store_path: data/accounts/gate-v5-paper/account.db
  feed_exchange: gate
  initial_capital: 67
  leverage: 50
  fee_rate: 0.0005
  maker_fee_rate: 0.0002
  funding_enabled: true
  position_mode: dual
  margin_mode: cross
  price_band_pct: 20.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2
