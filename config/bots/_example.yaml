# gate-signal-bot 机器人配置样例
# 复制为 config/bots/<bot_id>.yaml 后修改。以 _ 开头的文件会被忽略。

bot_id: alpha
enabled: true
env: live                 # live | testnet
api_key_env: GATE_API_KEY
api_secret_env: GATE_API_SECRET
# 模拟盘请用：
# env: testnet
# api_key_env: GATE_TESTNET_API_KEY
# api_secret_env: GATE_TESTNET_API_SECRET

symbols:                  # 白名单；空列表 = 不限制
  - BTC_USDT
  - ETH_USDT

max_notional_usd: 500     # 单笔名义 USDT 上限
max_orders_per_file: 20
max_files_per_run: 50
poll_interval_sec: 2
label_prefix: alpha       # 写入订单 text: t-<label>
