# gate-signal-bot 机器人配置样例
# 复制为 config/bots/<bot_id>.yaml 后修改。以 _ 开头的文件会被忽略。

bot_id: alpha
enabled: true
env: live                 # live | testnet
api_key_env: GATE_API_KEY
api_secret_env: GATE_API_SECRET
# 模拟盘请用：
# env: testnet
# api_key_env: GATE_TESTNET_API_KEY
# api_secret_env: GATE_TESTNET_API_SECRET

symbols:                  # 白名单；空列表 = 不限制
  - BTC_USDT
  - ETH_USDT

max_notional_usd: 500     # 单笔名义 USDT 上限
max_orders_per_file: 20
max_files_per_run: 50
poll_interval_sec: 2
label_prefix: alpha       # 写入订单 text: t-<label>

# 有仓时的进场管控（bot 级，不影响其它 bot）
#   strict     = 一账户一策略：有仓只收加/减/平/调TP-SL，拒新方案（默认）
#   manage_only = 同 strict，规则略宽（预留）
#   free       = 多策略共账户：不拦进场，只靠 replace 防堆积
position_policy: strict
# 新方案默认替换：none | symbol | all（JSON 里 replace 可覆盖）
default_replace: none
# 订单归属：own=只管本 label 单；all=整币种全撤（多策略共账户用 own）
order_scope: own
# ── 策略风控参数（按策略可调）──
require_sl: true            # false = 允许无止损开仓（不推荐）
account_risk:
  halt: false               # true=只允许平仓/撤单
  max_leverage: 10
  max_total_notional_usd: 500
  # daily_loss_limit_usd: 50

