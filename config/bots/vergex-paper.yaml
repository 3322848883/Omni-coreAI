# 既有策略6 · vergex 默认保守趋势 — 本地模拟盘（试跑）
# prompt: prompts/vergex_default.md（2% 仓位 / 杠杆≤50 / modify_tp_sl）
bot_id: vergex-paper
enabled: false
env: paper
symbols:
  - BTC_USDT
  - ETH_USDT
max_notional_usd: 150000
max_orders_per_file: 10
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: vgx
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 150000

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 20
  fee_rate: 0.0005
  maker_fee_rate: 0.0
  funding_enabled: false
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  enabled: false
  prompt_file: prompts/vergex_default.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 80
  write_hold: true
  tools:
    enabled: false
    native: true
    max_rounds: 4
  market:
    mode: rest_only
    indicators: [ema20, ema50, atr14, rsi14]
    extra_timeframes: ["1h"]
    extra_candles: 15
  ai_triggers:
    enabled: false
    max_active: 5
  risk:
    min_confidence: 0.55
    max_chips: 3
    max_notional_usd: 150000
  llm:
    provider: gw-flash
    reasoning_effort: high
