# Brooks 价格行为 · BTC — 正式配置
# 模板：_brooks_btc.example.yaml ｜ 策略：prompts/brooks_btc_pa.md

bot_id: brooks-btc
enabled: false
env: live
api_key_env: GATE_API_KEY
api_secret_env: GATE_API_SECRET

symbols:
  - BTC_USDT

max_notional_usd: 10000
max_orders_per_file: 5
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: brk
position_policy: strict
default_replace: symbol
order_scope: own
require_sl: true

account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 10000
  # 权益比例硬顶（executor._check_notional）：单笔名义 ≤ 权益 × 此倍数。
  # **这是预算的唯一真源**：strategist 的 _prompt_risk() 会把给 AI 的预算收敛成
  # min(max_notional_usd, 权益 × 此倍数)，所以权益变化时 AI 的预算自动跟上，
  # 不会再出现「AI 按旧预算报量、被闸门拒掉」（实测曾占实盘失败的 1/7）。
  # 因此上面的 max_notional_usd 只当宽松的绝对兜底 —— 不要拿它去「对齐闸门」。
  max_notional_pct: 5.0
  # 总量闸门（**按比例**）：持仓名义合计 + 本单 ≤ 权益 × 此倍数。
  # 用按比例而不是绝对值，是因为绝对值会随权益漂移而失效 —— 实测原
  # max_total_notional_usd=10000 相当于 113× 权益、永不触发，真正 bind 的只剩杠杆上限
  # 50×。加了 open_*→add_* 映射后仓位会单调增长（重复/过期计划每轮加仓），
  # 所以必须有一道**随权益收紧**的总量闸门，否则「单调增长 + 无回撤熔断 + 50 倍杠杆」会叠加。
  max_total_notional_pct: 10.0
  # daily_loss_limit：按要求不启用熔断

strategist:
  enabled: true
  prompt_file: prompts/brooks_btc_pa.md
  interval_sec: 900
  timeframe: 15m
  vision: true
  # 多周期图：5m / 15m / 1h / 4h 四张
  vision_timeframes: ["5m", "15m", "1h", "4h"]
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 120
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 3
  market:
    mode: hybrid
    indicators: [ema20, atr14]
    # 多周期图数据源
    timeframes: ["5m", "1h", "4h"]
    extra_candles: 80
  ai_triggers:
    enabled: true
    max_active: 5
    # 同一条件最快多久能再唤醒一轮（默认 60s）。触发子系统修好之前它一直没工作；
    # 修好后实测「条件持续成立」时会约 1 分钟唤醒一轮，而每轮都是一次 LLM 调用 ——
    # 节奏从 15 分钟变成分钟级，成本与交易频率都会上去。调到 300s，让事件唤醒回到
    # 「辅助 interval」的定位（interval 仍是 900s 主节奏）。
    default_cooldown_sec: 300
  risk:
    min_confidence: 0.6
    max_chips: 1
    max_notional_usd: 10000
  llm:
    provider: gw-flash
    reasoning_effort: high
