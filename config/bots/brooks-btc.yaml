# Brooks 价格行为 · BTC — 正式配置
# 模板：_brooks_btc.example.yaml ｜ 策略：prompts/brooks_btc_pa.md

bot_id: brooks-btc
enabled: false
env: live
api_key_env: GATE_API_KEY
api_secret_env: GATE_API_SECRET

symbols:
  - BTC_USDT

max_notional_usd: 10000
max_orders_per_file: 5
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: brk
position_policy: strict
default_replace: symbol
order_scope: own
require_sl: true

account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 10000
  # 权益比例硬顶（executor._check_notional）：单笔名义 ≤ 权益 × 此倍数。
  # **这是预算的唯一真源**：strategist 的 _prompt_risk() 会把给 AI 的预算收敛成
  # min(max_notional_usd, 权益 × 此倍数)，所以权益变化时 AI 的预算自动跟上，
  # 不会再出现「AI 按旧预算报量、被闸门拒掉」（实测曾占实盘失败的 1/7）。
  # 因此上面的 max_notional_usd 只当宽松的绝对兜底 —— 不要拿它去「对齐闸门」。
  max_notional_pct: 5.0
  # daily_loss_limit：按要求不启用熔断

strategist:
  enabled: true
  prompt_file: prompts/brooks_btc_pa.md
  interval_sec: 900
  timeframe: 15m
  vision: true
  # 多周期图：5m / 15m / 1h / 4h 四张
  vision_timeframes: ["5m", "15m", "1h", "4h"]
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 120
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 3
  market:
    mode: hybrid
    indicators: [ema20, atr14]
    # 多周期图数据源
    timeframes: ["5m", "1h", "4h"]
    extra_candles: 80
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.6
    max_chips: 1
    max_notional_usd: 10000
  llm:
    provider: gw-flash
    reasoning_effort: high
