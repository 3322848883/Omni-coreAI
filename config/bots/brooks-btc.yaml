# Brooks 价格行为 · BTC — 正式配置
# 模板：_brooks_btc.example.yaml ｜ 策略：prompts/brooks_btc_pa.md

bot_id: brooks-btc
enabled: false
env: live
api_key_env: GATE_API_KEY
api_secret_env: GATE_API_SECRET

symbols:
  - BTC_USDT

max_notional_usd: 400
max_orders_per_file: 5
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: brk
position_policy: strict
default_replace: symbol
order_scope: own
require_sl: true

account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 10000
  # 权益比例硬顶（executor._check_notional）：单笔名义 ≤ 权益 × 此倍数。
  # 实测生效值：权益 ~90 → 约 450。所以本文件的 max_notional_usd 与
  # strategist.risk.max_notional_usd 都必须 ≤ 它，否则 AI 按更大预算报量、
  # 然后被闸门拒掉（实测实盘 7 笔失败里 1 笔：size_usd=476 > equity×500%=448）。
  max_notional_pct: 5.0
  # daily_loss_limit：按要求不启用熔断

strategist:
  enabled: true
  prompt_file: prompts/brooks_btc_pa.md
  interval_sec: 900
  timeframe: 15m
  vision: true
  # 多周期图：5m / 15m / 1h / 4h 四张
  vision_timeframes: ["5m", "15m", "1h", "4h"]
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 120
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 3
  market:
    mode: hybrid
    indicators: [ema20, atr14]
    # 多周期图数据源
    timeframes: ["5m", "1h", "4h"]
    extra_candles: 80
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.6
    max_chips: 1
    max_notional_usd: 400
  llm:
    provider: gw-flash
    reasoning_effort: high
