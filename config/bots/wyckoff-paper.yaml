# 人格13 · Wyckoff — 本地模拟盘
# 四阶段 + Spring/UTAD/SOS/LPS + 量价确认
bot_id: wyckoff-paper
enabled: false
env: paper
symbols:
  - BTC_USDT
  - ETH_USDT
max_notional_usd: 50000
max_orders_per_file: 10
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: wyk
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 150000
  daily_loss_limit_usd: 1000

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 20
  fee_rate: 0.0005
  maker_fee_rate: 0.0
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.005
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  enabled: true
  prompt_file: prompts/wyckoff_pa.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  # 80 根看不清一个完整区间。tv_wyckoff 内部固定吃 >=500 根，
  # 这里给的是让模型自己核对量价形态用的原始 K 线。
  candles: 150
  write_hold: true
  # Wyckoff 只认量价（OHLCV + 成交量），故收窄工具面。
  # 实测未收窄时（35 个工具全开）模型会拿 indicators(atr14/ema20/rsi14) 当入场理由，
  # 并用 smc_map 的 BOS / Premium-Discount 判断 Wyckoff 阶段 ——
  # 工具面看得到就会用，直接从面里拿掉。
  tools:
    enabled: true
    native: true
    # 跨周期要多次调 tv_wyckoff（15m + 1h），4 轮会截断
    max_rounds: 5
    allow:
      - klines        # 原始 OHLCV：核对量价形态
      - tv_wyckoff    # 五阶段状态机 + 15 事件 + 双评分 + next/checks
      - ticker        # 实时价：挂限价、算止损距离
      - contract      # 最小下单量/张值/杠杆上限：仓位换算
  # Wyckoff 不依赖任何 skill；空列表 = 不载入（缺省则是全部可见）
  skills: []
  market:
    mode: rest_only
    # 不喂任何传统指标（原为 [obv, atr14]，实测模型会拿它当入场理由）。
    # 原版引擎自己算 ATR，也完全不用 OBV（它用的是原始 volume 与 50 期均量比）。
    indicators: []
    extra_timeframes: ["1h"]
    extra_candles: 15
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.55
    max_chips: 3
    max_notional_usd: 50000
  llm:
    provider: gw-flash
    reasoning_effort: high
