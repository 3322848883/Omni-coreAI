bot_id: pa-b
enabled: false
env: paper
exchange: okx
symbols: [BTC_USDT]
max_notional_usd: 3000
label_prefix: pab
position_policy: free
require_sl: true
paper:
  feed_exchange: okx
  initial_capital: 5000
  leverage: 20
strategist:
  # 2026-10-25 停用：旧键 `strategist.enabled` 已删除（零消费，写 false 也会被
  # 拉起）。真正生效的开关是下面这行 —— supervisor.prepare 读
  # runtime.plan_loop / runtime.run，缺省为 True。
  runtime: {plan_loop: false, run: false}
  prompt_file: prompts/smc_trader.md
  timeframe: 15m
  candles: 30
  write_hold: false
  # 2026-10-25 修：人格 `smc_trader.md` 要求 smc_map/smc_events，而这里是
  # `enabled: false` → 模型每轮去调一个不存在的工具，白烧一根 K 线。
  # 同人格的 smc-trader-paper / pt-a2 都是开着的，只有这里不一致。
  # （本 bot 已由 C1 用 runtime.plan_loop: false 停用，改配置不会让它跑起来。）
  tools: {enabled: true, native: true, max_rounds: 3}
  risk: {min_confidence: 0.3, max_chips: 1, max_notional_usd: 3000}
  llm: {provider: gw-flash, reasoning_effort: low}
