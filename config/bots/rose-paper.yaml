# 人格2 · PriceActionRose — 本地模拟盘
# 5m 背景 + 1m 信号；EMA20/200；限价优先；1% 风险真算仓位
bot_id: rose-paper
enabled: true
env: paper
symbols:
  - BTC_USDT
  - ETH_USDT
max_notional_usd: 100000
max_orders_per_file: 20
max_files_per_run: 50
poll_interval_sec: 2
label_prefix: ros
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 150000
  daily_loss_limit_usd: 400

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 20
  fee_rate: 0.0005
  maker_fee_rate: 0.0
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.005
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  enabled: true
  prompt_file: prompts/rose_pa.md
  # 5m 背景；1m 找信号（extra_timeframes + 工具拉 1m）
  interval_sec: 900
  timeframe: 5m
  event_on_kline_close: true
  event_timeframe: 5m
  candles: 120
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 5
  market:
    mode: rest_only
    indicators: [ema20, ema200, atr14]
    extra_timeframes: ["1m", "15m"]
    extra_candles: 20
  ai_triggers:
    enabled: true
    max_active: 8
  risk:
    min_confidence: 0.55
    max_chips: 5
    max_notional_usd: 100000
  llm:
    provider: gw-flash
    reasoning_effort: high
