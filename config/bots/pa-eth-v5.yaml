# Brooks 人格 v5（交易者宣言体）· ETH_USDT
#
# 用途：本地测试 + 服务器 paper 共用同一份配置（单一来源，避免双端漂移）。
#       5m 主周期 + 5m/15m/1h/4h 四周期 EMA20；逐K 20 根；工具白名单只留 PA 7 个。
#       ① symbol = ETH_USDT
#       ② account_risk.max_notional_pct = 20.0  ← 修复「未配默认 5×权益=50000 截断 2% 风险」
#
# 切实盘（三处，改完必须重启进程，配置无热重载）：
#   1) env: live
#   2) 加 api_key_env: GATE_API_KEY / api_secret_env: GATE_API_SECRET
#   3) account_risk 加 max_total_notional_pct: 10.0；paper 段可留（live 不读）
#   账户与 brooks-btc / brooks-eth 相同，靠 label_prefix=pev5 隔离，**三者不得同时 enabled**。
bot_id: pa-eth-v5
enabled: false          # 服务器部署后仍保持禁用：启动需显式 run/plan-loop
env: live
exchange: gate
api_key_env: GATE_API_KEY
api_secret_env: GATE_API_SECRET
symbols:
  - ETH_USDT
max_notional_usd: 200000
max_orders_per_file: 10
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: pev5
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  risk_pct: 0.02
  max_leverage: 50
  # 权益比例上限：10000 × 20 = 200000，与 max_notional_usd 对齐，避免 5×权益 默认值把 2% 风险截断
  max_notional_pct: 20.0
  max_total_notional_usd: 300000
  daily_loss_limit_usd: 1000
  # 2026-10-27 切实盘（账户 GATE_API_KEY，权益 ~77 USDT）：总名义 ≤10×权益
  max_total_notional_pct: 10.0

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 50
  fee_rate: 0.0005
  # 0.0002 = Gate maker 0.02%。原先这里写 0.0，但存量库 `account.db` 被一条
  # 已删除的迁移 UPDATE 改成了 0.0002 —— **配置写免佣、实际在收费**。
  # 现在与库值对齐（也让 maker/taker 拆分真正生效：网格/限价腿全是 maker）。
  maker_fee_rate: 0.0002
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 10.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  # `enabled: true` 若保留也无效（本地是零消费死键），真正生效的是
  # `strategist.runtime.plan_loop` / `runtime.run`（supervisor 读）。
  prompt_file: prompts/_pa_4tf_equal_v2.md
  # 🔴 `persona_strict` 已删除（2026-10-27 核实）：全仓**零读取点**。
  # 人格声明失配（人格里写了不在 symbols 的合约）只有一个 warn
  # （`config._warn_persona_symbols`），**fail-closed 从未实现** —— 之前
  # 写着 `persona_strict: true` 会让人以为「失配即拒绝启动」，实际只是告警。
  skills: [brooks-bar-by-bar]
  # 🔴 `skills_required: true` 已删除（2026-10-24）：本地主线**零引用**此键
  # （只有服务器 trigger-fix worktree 实现了「首轮 tool_choice 硬制」）。
  # 留在这儿会让人以为「每轮必载技能」已生效，实际靠模型自觉。
  # 注意：注释里提到的 `tools.require_first` 同样是**未实现的死键**
  # （2026-10-27 核实，verify-paper 曾配过，已一并删除）。
  # 🔴 `replace_on_entry` 已删除（2026-10-27 核实）：全仓**零读取点**。
  # 真正生效的开关是：
  #   ① bot 级 `default_replace: none|symbol|all`（executor._replace_mode）
  #   ② 信号级 per-intent `replace` 字段（模型自己写）
  # 本 bot 当前 `default_replace: none` = **不替换**。若确实需要「重挂入场单前
  # 先撤同 symbol 旧单」，改 default_replace 或让模型在信号里写 replace —— 
  # 别再用 replace_on_entry（它从来没生效过）。
  interval_sec: 300
  timeframe: 5m
  event_on_kline_close: true
  event_timeframe: 5m
  candles: 200
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 6
    # 只留 PA 需要的工具：schema 层过滤（模型看不到就调不到）+ 调用点双保险。
    # 未配置时是 36/36 全开 —— 实测模型会顺手调 orderbook / smc_map，违反人格的铁律。
    allow: [skill, skill_ref, account, indicators, klines, ticker, contract]
    # 2026-10-28（用户要求）：「先加载技能、并逐周期查行情，才许出方案」。
    # 引擎会统计本轮 `tool_usage` 的「工具:周期」覆盖；缺项 → 强制重试一次并把
    # 缺的具体项告诉模型（仍缺则放行 + 日志留痕，不做整轮作废）。
    #   skill 项用技能名当键（skill 调用没有 tf）；
    #   四周期必须各自单独查一次 —— 快照虽自带 HTF 数据，但「有没有真的逐周期看」
    #   需要可审计的调用痕迹，不能靠模型自述。
    required_coverage:
      skill: [brooks-bar-by-bar]
      indicators: [5m, 15m, 1h, 4h]
  market:
    mode: rest_only
    indicators: [ema20, atr14]
    # 2026-10-27 15 → 60：HTF（15m/1h/4h）的图与 compact K 线要够看；
    # indicators 取数已按 warmup 放大，这里只影响进 prompt 的行数
    extra_candles: 60
    # 2026-10-27：HTF K 线进快照 —— 配合 strategist.vision_timeframes 发 4 周期图
    extra_timeframes: [15m, 1h, 4h]
  # 2026-10-27：每轮发 4 张 K 线图（5m 主周期 + 15m/1h/4h 背景）。
  # vision_timeframes 会整体替换默认的 [主周期]，所以 5m 必须显式写。
  # 实测前提（2026-10-27）：网关 cn:deepseek-v4-flash 支持多图且按序识别。
  vision_timeframes: [5m, 15m, 1h, 4h]
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.55
    max_chips: 2
    max_notional_usd: 200000
  llm:
    # 服务器实测（brooks-eth / martin-grid 2026-10-12 起）：global 池（gw-flash）
    # 持续 503 no_healthy_account，每轮白耗 ~5s 重试再切备用 → 首选 cn 池。
    provider: gw-cn-flash
    fallback: [gw-flash, deepseek-official]
    reasoning_effort: high
