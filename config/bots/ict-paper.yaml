# 人格12 · ICT — 本地模拟盘
# Killzone(London 07-10 / NY 12-15 UTC) + 流动性/FVG/OB/OTE
bot_id: ict-paper
enabled: false
env: paper
symbols:
  - BTC_USDT
  - ETH_USDT
max_notional_usd: 50000
max_orders_per_file: 10
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: ict
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 150000
  daily_loss_limit_usd: 300

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 20
  fee_rate: 0.0005
  maker_fee_rate: 0.0
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.005
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  enabled: true
  prompt_file: prompts/ict_pa.md
  interval_sec: 900
  timeframe: 5m
  event_on_kline_close: true
  event_timeframe: 5m
  candles: 80
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 5
  market:
    mode: rest_only
    indicators: [atr14]
    extra_timeframes: ["15m", "1h"]
    extra_candles: 15
  ai_triggers:
    enabled: true
    max_active: 6
  risk:
    min_confidence: 0.55
    max_chips: 3
    max_notional_usd: 50000
  llm:
    provider: gw-flash
    reasoning_effort: high
