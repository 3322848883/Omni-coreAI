# 既有策略8 · 网格/均值回归 — 本地模拟盘（试跑）
# prompt: prompts/multi_meanrev.md（3-5层网格 / 多空双向 / 合计风险≤5% / limit_order tp）
bot_id: meanrev-paper
enabled: true
env: paper
symbols:
  - BTC_USDT
  - ETH_USDT
max_notional_usd: 150000
max_orders_per_file: 20
max_files_per_run: 30
poll_interval_sec: 2
label_prefix: mrv
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 200000

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 20
  fee_rate: 0.0005
  maker_fee_rate: 0.0
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  enabled: true
  prompt_file: prompts/multi_meanrev.md
  interval_sec: 180
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 40
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 4
  market:
    mode: rest_only
    indicators: [atr14, ema20, rsi14]
    extra_timeframes: ["1h"]
    extra_candles: 15
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.5
    max_chips: 5
    max_notional_usd: 150000
  llm:
    provider: gw-flash
    reasoning_effort: high
