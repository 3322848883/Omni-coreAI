# 既有策略7 · 突破趋势 — 本地模拟盘（试跑）
# prompt: prompts/multi_breakout.md（20-30根K突破 / 2% / modify_tp_sl）
bot_id: breakout-paper
enabled: false
env: paper
symbols:
  - BTC_USDT
  - ETH_USDT
max_notional_usd: 50000
max_orders_per_file: 8
max_files_per_run: 15
poll_interval_sec: 2
label_prefix: brk1
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 150000

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 20
  fee_rate: 0.0005
  maker_fee_rate: 0.0
  funding_enabled: false
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  enabled: false
  prompt_file: prompts/multi_breakout.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 30
  write_hold: true
  tools:
    enabled: false
    native: true
    max_rounds: 4
  market:
    mode: rest_only
    indicators: [atr14, ema20]
    extra_timeframes: ["1h"]
    extra_candles: 15
  ai_triggers:
    enabled: false
    max_active: 5
  risk:
    min_confidence: 0.55
    max_chips: 1
    max_notional_usd: 50000
  llm:
    provider: gw-flash
    reasoning_effort: high
