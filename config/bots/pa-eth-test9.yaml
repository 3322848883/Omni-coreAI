# Brooks 三部曲 + 逐K 技能验证载体 #9
#
# 目的：验证新技能 brooks-bar-by-bar（skills-src/brooks-bar-by-bar）在真实决策里
#       是否被每轮加载、是否真被使用。人格文件与 test7 完全相同（一字不改），
#       唯一变量 = strategist.skills 从 price-action-trading 换成 brooks-bar-by-bar。
#
# 已知代价：人格第 7 行写死 skill(price-action-trading)，而白名单只放新技能，
#          所以每轮首调会拿到一次 "not enabled"，错误里带 available 列表，
#          模型据此改用新技能（同轮完成，不影响决策）。
#          刻意**不**把旧技能加进白名单——否则 15,982 字符的旧正文会被真加载一次。
bot_id: pa-eth-test9
enabled: false          # 基线禁用；本机启用走 config/bots.local/ overlay
env: paper
exchange: gate
symbols:
  - ETH_USDT
max_notional_usd: 50000
max_orders_per_file: 10
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: pet9
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  risk_pct: 0.02        # 人格要求 2%；不写引擎默认 1%（实测砍半）
  max_leverage: 50
  max_total_notional_usd: 150000
  daily_loss_limit_usd: 1000

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 50
  fee_rate: 0.0005
  maker_fee_rate: 0.0002
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 10.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  prompt_file: prompts/_pa_slim_test_eth_15m.md
  skills: [brooks-bar-by-bar]   # ← 唯一变量（test7 为 price-action-trading）
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 200
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 6
  market:
    mode: rest_only
    indicators: [ema20, atr14]
    extra_candles: 15
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.55
    max_chips: 2
    max_notional_usd: 50000
  llm:
    provider: gw-flash
    reasoning_effort: high
