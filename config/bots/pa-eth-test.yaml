# Brooks PA 精简人格 · ETH 本地验证 bot（2026-10-21）
#
# 目的：不改实盘、不动既有 bot，单开一个 paper 载体验证用户改后的人格
#       （prompts/_pa_slim_test_eth.md = reports/prompts_live_20261021/brooks_btc_pa.md
#         仅把 BTC_USDT 字面替换为 ETH_USDT，其余逐字不动）。
# 结构对齐 brooks-pa-paper（50x / 2% 风险 / 单币 / paper 撮合走 Gate 真实行情）。
bot_id: pa-eth-test
enabled: false          # 基线禁用；本机启用走 config/bots.local/ overlay
env: paper
exchange: gate
symbols:
  - ETH_USDT
max_notional_usd: 50000
max_orders_per_file: 10
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: pet
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 150000
  daily_loss_limit_usd: 1000

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 50
  fee_rate: 0.0005
  maker_fee_rate: 0.0002
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 10.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  prompt_file: prompts/_pa_slim_test_eth.md
  skills: []
  interval_sec: 900
  timeframe: 5m               # 人格：主交易周期 5m
  event_on_kline_close: true
  event_timeframe: 5m
  candles: 200
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 6
  market:
    mode: rest_only
    indicators: [ema20, atr14]
    extra_candles: 15
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.55
    max_chips: 2
    max_notional_usd: 50000
  llm:
    provider: gw-flash
    reasoning_effort: high
