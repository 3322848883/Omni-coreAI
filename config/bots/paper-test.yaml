# 本地模拟盘测试 bot（paper trading）
bot_id: paper-test
enabled: true
env: paper                     # 本地模拟交易所，不需要交易所密钥
symbols:
  - BTC_USDT
  - ETH_USDT
max_notional_usd: 500
max_orders_per_file: 20
max_files_per_run: 50
poll_interval_sec: 2
label_prefix: pt
position_policy: strict
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 20
  max_total_notional_usd: 500

# 本地模拟盘配置
paper:
  feed_exchange: gate          # 行情/费率/合约元数据来源
  initial_capital: 10000       # 默认 10000 USDT
  leverage: 20                 # 默认 20x
  fee_rate: 0.0005             # taker 0.05%
  maker_fee_rate: 0.0
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.005
  trigger_price_type: latest
  tick_interval_sec: 2

# LLM 策略层（真实 AI 分析 → Plan → 信号 → paper 执行）
strategist:
  enabled: true
  prompt_file: prompts/vergex_default.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 120
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 3
  market:
    mode: rest_only
    indicators: [ema20, rsi14, atr14, macd, sqzmom]
    extra_candles: 15
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.6
    max_chips: 1
    max_notional_usd: 500
  llm:
    provider: gw-flash
    reasoning_effort: high
