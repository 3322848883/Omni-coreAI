# 既有策略3 · 陈默生存式 — 本地模拟盘（试跑）
# prompt: prompts/chenmo_survival.md（工具/指标全开，杠杆≤50，日亏 5% 程序停）
bot_id: chenmo-paper
enabled: false
env: paper
symbols:
  - BTC_USDT
  - ETH_USDT
max_notional_usd: 100000
max_orders_per_file: 10
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: cmp
position_policy: manage_only
default_replace: none
order_scope: own
require_sl: true
account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 150000
  # 日亏停单：关闭（由人格自律，不程序熔断）

paper:
  feed_exchange: gate
  initial_capital: 10000
  leverage: 25
  fee_rate: 0.0005
  maker_fee_rate: 0.0
  funding_enabled: true
  position_mode: single
  margin_mode: isolated
  price_band_pct: 5.0
  maintenance_margin_rate: 0.01
  trigger_price_type: latest
  tick_interval_sec: 2

strategist:
  enabled: true
  prompt_file: prompts/chenmo_survival.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 100
  write_hold: true
  tools:
    enabled: true
    native: true
    max_rounds: 5
  market:
    mode: rest_only
    # 全指标开放（陈默人设允许）
    indicators: ["all"]
    extra_timeframes: ["1h", "4h"]
    extra_candles: 20
  ai_triggers:
    enabled: true
    max_active: 6
  risk:
    min_confidence: 0.55
    max_chips: 3
    max_notional_usd: 100000
  llm:
    provider: gw-flash
    reasoning_effort: high
