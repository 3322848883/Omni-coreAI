# Brooks 价格行为 · BTC 机器人（模板）
# 复制为 config/bots/brooks-btc.yaml

bot_id: brooks-btc
enabled: true
env: testnet
api_key_env: GATE_TESTNET_API_KEY
api_secret_env: GATE_TESTNET_API_SECRET

symbols:
  - BTC_USDT

max_notional_usd: 50
label_prefix: brk
position_policy: strict
default_replace: symbol
order_scope: own
require_sl: true

account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 50

strategist:
  enabled: true
  prompt_file: prompts/brooks_btc_pa.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  candles: 120
  write_hold: true
  tools:
    enabled: true
    max_rounds: 3
  market:
    mode: hybrid
    # 价格行为：默认少指标（仅 EMA20 + ATR 止损距离）
    indicators: [ema20, atr14]
    timeframes: []
    extra_candles: 15
  ai_triggers:
    enabled: true            # 允许事件触发再次唤醒
    max_active: 5
  risk:
    min_confidence: 0.7
    max_chips: 1
    max_notional_usd: 50
  llm:
    base_url_env: OPENAI_BASE_URL
    api_key_env: OPENAI_API_KEY
    model: global:deepseek-v4.1-flash
    temperature: 0.1
    timeout_sec: 90
    max_tokens: 4096
