# Wyckoff · ETH 单币实盘 — eth-disc 讨论组成员
#
# 由 config/bots/wyckoff-live.yaml 复制而来，策略段**逐字一致**，差异只有：
#   bot_id / label_prefix，以及 symbols 由 [BTC_USDT, ETH_USDT] 收窄为 ETH 单币。
# 复制而非复用现有 bot，是为了让讨论组与独立实盘 bot 互不影响 ——
# 现有 smc-live / orderflow-live / wyckoff-live 保持原样。
#
# 为什么要单币：讨论组里三个成员必须看同一个标的。快照按 symbols 注入行情
# （snapshot.py 的 for sym in symbols），双币配置会让三个人格各说一个币，
# 融合时串标的。而组级没有标的覆盖能力（PersonaGroup.trigger 定义了但从未使用）。
#
# enabled: false —— 讨论组只做「分析 + 讨论 + 投票」。persona-run 不读 enabled
# （load_all_bots 全量加载），所以分析照常，但本 bot 不会被 watchdog 拉起。
#
# 策略：prompts/wyckoff_pa.md（人格13 · Wyckoff）
#
# ⚠️ account_risk 的四个数字是「小额起步」值，不是按风险预算算的。
#    本 bot 属讨论组、enabled: false，不会下单；若将来要独立启用请重新复核。
#
# strategist 段与 wyckoff-paper.yaml 的实测结论一致：工具面收窄到 4 个、
# indicators/skills 清空、candles 150、max_rounds 5。

bot_id: wyckoff-eth-live
enabled: false
env: live
api_key_env: GATE_API_KEY
api_secret_env: GATE_API_SECRET

symbols:
  - ETH_USDT

# 绝对兜底（真正的闸门是下面的 max_notional_pct / max_total_notional_pct）
max_notional_usd: 10000
max_orders_per_file: 5
max_files_per_run: 20
poll_interval_sec: 2
label_prefix: wye
position_policy: strict
default_replace: symbol
order_scope: own
require_sl: true

account_risk:
  halt: false
  max_leverage: 50
  max_total_notional_usd: 10000
  # 权益比例硬顶：单笔名义 ≤ 权益 × 此倍数（executor._check_notional 执行）
  # 1.0 = 起步值，跑顺了再抬；人格自己按 1% 风险反推仓位，这条是硬上限
  max_notional_pct: 1.0
  # 总量闸门（按比例）
  max_total_notional_pct: 2.0
  # 绝对日亏兜底（按小额起步设）
  daily_loss_limit_usd: 100
  # 裸仓自动补保护：先跑 dry（只记录「本来会挂什么」，不下单），观察一轮再改 true
  auto_protect: "dry"
  auto_protect_sl_pct: 2.0

strategist:
  enabled: true
  prompt_file: prompts/wyckoff_pa.md
  interval_sec: 900
  timeframe: 15m
  event_on_kline_close: true
  event_timeframe: 15m
  # 80 根看不清一个完整区间。tv_wyckoff 内部固定吃 >=500 根，
  # 这里给的是让模型自己核对量价形态用的原始 K 线。
  candles: 150
  write_hold: true
  # Wyckoff 只认量价（OHLCV + 成交量），故收窄工具面。
  # 实测未收窄时（35 个工具全开）模型会拿 indicators(atr14/ema20/rsi14) 当入场理由，
  # 并用 smc_map 的 BOS / Premium-Discount 判断 Wyckoff 阶段 ——
  # 工具面看得到就会用，直接从面里拿掉。
  tools:
    enabled: true
    native: true
    # 跨周期要多次调 tv_wyckoff（15m + 1h），4 轮会截断
    max_rounds: 5
    allow:
      - klines        # 原始 OHLCV：核对量价形态
      - tv_wyckoff    # 五阶段状态机 + 15 事件 + 双评分 + next/checks
      - ticker        # 实时价：挂限价、算止损距离
      - contract      # 最小下单量/张值/杠杆上限：仓位换算
  # Wyckoff 不依赖任何 skill；空列表 = 不载入（缺省则是全部可见）
  skills: []
  market:
    # 用 rest_only 而不是 hybrid：hybrid 会读本地 kline.db，而那张表的
    # ema20/atr14 两列会被一路带进注入的 K 线快照（snapshot 不剥携带列），
    # 等于把刚拿掉的传统指标又从后门放回来。rest_only 走 REST，那两列是 None。
    mode: rest_only
    # 不喂任何传统指标（原为 [obv, atr14]，实测模型会拿它当入场理由）。
    # 原版引擎自己算 ATR，也完全不用 OBV（它用的是原始 volume 与 50 期均量比）。
    indicators: []
    extra_timeframes: ["1h"]
    extra_candles: 15
  ai_triggers:
    enabled: true
    max_active: 5
  risk:
    min_confidence: 0.6     # 实盘取保守值（模拟盘用 0.55）
    max_chips: 1            # 单币单腿（原双币配置是 2）
    max_notional_usd: 10000
  llm:
    provider: gw-flash
    reasoning_effort: high
