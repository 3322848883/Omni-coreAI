# LLM providers — configure once; bots pick by name
# usage in config/bots/<id>.yaml:
#   llm:
#     provider: deepseek-official
#     model: deepseek-flash        # optional override
#     fallback: gw-cn-flash       # optional: 覆盖该供应商的备用链
#
# `fallback`（供应商级或 bot 级，接受单个名字或列表）是**备用供应商链**：
# 主供应商把自身重试耗完后按顺序切，而不是让整轮决策降级 hold。
# 实测网关会返回 429 `usage exceeds frequency limit ... switch to the other models`
# 与 503 `no_healthy_account` —— 这两条路原先都只通向「降级 hold」。

default: deepseek-official

providers:
  deepseek-official:
    label: DeepSeek 官方（网关整体故障时的容灾）
    base_url: https://api.deepseek.com/v1
    # 独立变量：网关用的是 OPENAI_API_KEY，官方 API 必须用自己的 key，
    # 否则认证失败（且会掩盖「网关挂了但备用也没接住」的真相）。
    api_key_env: DEEPSEEK_API_KEY
    # base_url 同样必须独立（2026-10-13 实盘 401 事故）：
    # llm_client 的 base_url 优先级是 base_url_env → OPENAI_BASE_URL → default_base_url，
    # 不设独立 env 时官方腿会被 .env 的 OPENAI_BASE_URL=http://127.0.0.1:7863 劫持到
    # 网关 —— 拿官方 key 敲网关 → 401，容灾链三腿全灭、每轮降级 hold。
    base_url_env: DEEPSEEK_BASE_URL
    model: deepseek-flash
    thinking: true
    reasoning_effort: max
    timeout_sec: 120
    max_tokens: 8192
    json_mode: true

  gw-flash:
    label: 自建网关 deepseek-v4.1-flash
    base_url: http://69.12.85.185:7863/v1
    api_key_env: OPENAI_API_KEY
    # 2026-10-26 22:50：网关下线 global 渠道（谷歌/国际池整体移除，/v1/models
    # 只剩 cn:*），主模型切 cn:deepseek-v4.1-flash（实测 1/1 成功、带 reasoning）。
    model: cn:deepseek-v4.1-flash
    # thinking 必须为 true：该模型本身就会推理，关掉会让 effective_max_tokens()
    # 回退到 8192（而非 65536），推理一超预算就截断，Plan JSON 根本写不出来
    thinking: true
    reasoning_effort: high
    timeout_sec: 240
    max_tokens: 8192
    json_mode: true
    # 备用链：主池 429 限流时按顺序切。实测 2026-10-05 主池限流到次日
    # 08:39 UTC，网关回包自己提示「switch to the other models」。
    # 2026-10-08 起：首选 cn 池（`cn:deepseek-v4-flash`，实测 7/7 成功、
    # 推理走中文；同量级）。
    # sg 池（gw-flash-sg）已弃用，不再进备用链。
    # 第二道是**真·跨供应商**（DeepSeek 官方 API）：网关整体故障时还能活。
    # 它用自己的 DEEPSEEK_API_KEY，与网关的 OPENAI_API_KEY 分开 —— 共用会在
    # 官方 API 上认证失败，还会掩盖「网关挂了备用也没接住」。
    fallback: [gw-cn-flash, deepseek-official]

  gw-cn-flash:
    label: 自建网关 deepseek-v4-flash（cn 池）
    base_url: http://69.12.85.185:7863/v1
    api_key_env: OPENAI_API_KEY
    model: cn:deepseek-v4-flash
    thinking: true
    reasoning_effort: high
    timeout_sec: 240
    max_tokens: 8192
    json_mode: true

  gw-hy4-preview:
    label: 自建网关 hy4-preview-f（对比用）
    base_url: http://69.12.85.185:7863/v1
    api_key_env: OPENAI_API_KEY
    model: cn:hy4-preview-f
    thinking: true
    reasoning_effort: high
    timeout_sec: 240
    max_tokens: 8192
    json_mode: true

  gw-v4-pro:
    label: 自建网关 deepseek-v4-pro
    base_url: http://69.12.85.185:7863/v1
    api_key_env: OPENAI_API_KEY
    model: cn:deepseek-v4-pro
    thinking: true
    reasoning_effort: high
    timeout_sec: 120
    max_tokens: 8192
    json_mode: true
