# 信号广播配置 —— 一信号 → 多 bot（目标只在此处配置，AI 碰不到）
# python -m gate_bot broadcast [--once]

routes:
  - name: dual-gate-okx
    from: signal-feed
    to: [gate-btc, okx-btc]
    enabled: false
  - name: single-gate
    from: signal-feed
    to: [gate-btc]
    enabled: false

poll_interval_sec: 2
max_files_per_run: 50
