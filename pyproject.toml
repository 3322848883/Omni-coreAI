[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gate-signal-bot"
version = "1.1.0"
description = "Gate.io futures signal executor + LLM strategist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
gate-bot = "gate_bot.__main__:main"

[tool.setuptools.packages.find]
include = ["gate_bot*"]
