[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "omnialpha"
version = "1.1.0"
description = "Gate.io futures signal executor + LLM strategist"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6.0"]

[project.scripts]
omnialpha = "omnialpha.__main__:main"

[tool.setuptools.packages.find]
include = ["omnialpha*"]
