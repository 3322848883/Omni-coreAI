market_type: futures
env: live          # live=实盘（默认）| testnet=测试网；行情公开接口与账户均按此环境
symbols:
  - name: BTC_USDT
    intervals: [1m, 5m, 15m, 30m, 1h, 4h, 1d]
  - name: ETH_USDT
    intervals: [1m, 5m, 15m, 30m, 1h, 4h, 1d]
  - name: SOL_USDT
    intervals: [1m, 5m, 15m, 30m, 1h, 4h, 1d]
  - name: XAU_USDT
    intervals: [1m, 5m, 15m, 30m, 1h, 4h, 1d]
  - name: XAG_USDT
    intervals: [1m, 5m, 15m, 30m, 1h, 4h, 1d]
# 指标落库集合（**配置驱动**：配了才算、才算落库列；没配的不加列、不计算）
# 默认 9 个声明 → 11 个物理列：
#   ema20/ema50/ema200、atr14、rsi14、macd/macd_dea/macd_hist、boll20/boll20_upper/boll20_lower
indicators:
  - ema: [20, 50, 200]
  - atr: [14]
  - rsi: [14]
  - macd: [12, 26, 9]
  - boll: [20, 2]
output_dir: "./data"

# 保留策略：**分周期**（v2 起生效；旧字段保留作兜底）
#   max_candles  滚动上限（按行数截断）
#   days         时间上限（0 = 不按时间删）
#   depth_bars   可回填上限（Gate 单次 limit≤1000 的回溯深度；1m 只能累积不能回填 4 天）
# 校验：max_candles ≥ 指标预热（ema200 → 1005）、days 容量 ≥ 0.9×max_candles
retention:
  per_interval:
    1m:  {max_candles: 5760, days: 4,    depth_bars: 1000}
    5m:  {max_candles: 8640, days: 30,   depth_bars: 1000}
    15m: {max_candles: 8640, days: 90,   depth_bars: 1000}
    30m: {max_candles: 8640, days: 180,  depth_bars: 1000}
    1h:  {max_candles: 8760, days: 365,  depth_bars: 1000}
    4h:  {max_candles: 2000, days: 333,  depth_bars: 1000}
    1d:  {max_candles: 1600, days: 1600, depth_bars: 1500}
  reconcile_sec:            # REST 校准频率（按周期；1d 从 5 分钟降到 1 小时）
    1m: 300
    5m: 300
    15m: 900
    30m: 900
    1h: 1800
    4h: 1800
    1d: 3600

# 旧全局阈值：v2 的分周期策略生效后仅作兜底
retention_days: 300
max_candles: 2000
log_level: INFO

# === 多所 K 线采集（kline_watcher_multi，非 Gate 五所）===
# 为什么单独声明：Gate 独有的贵金属 XAU/XAG 在非 Gate 所**并非都存在**（实测
# hyperliquid 无、bitget 有），所以另列一份清单，用六所都有的 DOGE/XRP 补位。
# 这份清单以前写死在 watchdog.py 的 --symbols 参数里 —— 加币要改代码，漏改那处
# 不报错、只是永远没数据。现在它在这里（声明），watchdog 启动时逐所校验：
# 该所没上这个合约就**告警并跳过**（不静默）。
# 周期与 Gate 的差异：其余五所无 30m（见 AGENTS.md「品种 / 周期」）。
multi_venue:
  symbols:
    - BTC_USDT
    - ETH_USDT
    - SOL_USDT
    - DOGE_USDT
    - XRP_USDT
  intervals: [1m, 5m, 15m, 1h, 4h, 1d]

# === 账户推送配置 ===
# 密钥不落盘（可移植技能）：优先读取环境变量 GATE_API_KEY / GATE_API_SECRET；
# 如确需写入本文件，请填入你自己的密钥（需要 Futures 权限）。
# api_key: ""
# api_secret: ""
# 启用账户推送（持仓、余额、挂单）
account_push: true
# 账户汇总打印间隔（秒）
account_push_interval: 60
